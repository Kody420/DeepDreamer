; ================= DeepDreamer settings =================
; Edit, save, then run 3_RENDER.bat (or 2_PREVIEW.bat for a quick test).

[render]
width = 1920
height = 1080
fps = 30
seconds = 20              ; length of the video
output = dream_1080p30.mp4
segment_seconds = 30      ; render is saved in chunks, so an interrupted run resumes
model = vgg16             ; which network dreams: vgg16 or googlenet (the original 2015 DeepDream network)
prompt = bird, dog, cat, face ; text to steer the dream toward (empty = plain dreaming)
prompt_mode = none        ; clip = any text (CLIP RN50, 2021) / imagenet = ImageNet object names (vgg16/googlenet) / none = prompt off, dream only
prompt_weight = 1         ; 0..1 how strongly the prompt steers; 0.8-0.95 for clearly visible results
prompt_cuts = 16          ; crops the prompt network looks at each frame (more = steadier, slower)
steps = 4                 ; dream gradient steps per frame (more = stronger/slower)
strength = 2.0            ; how hard the net hallucinates. higher = wilder, less stable
scales = 0.17,0.5,1.0     ; multi-scale: small numbers make BIG shapes (eyes, faces), 1.0 = fine detail
zoom_rate = 0.9           ; how fast you fall into the picture (per second)
rotate_rate = 0.045       ; slow swirl
resample = bilinear       ; how each frame is warped. bilinear = stable; bicubic = a bit sharper but melts into zig-zag streaks at 60 fps
noise = 0.001             ; fresh noise each frame = new material to hallucinate on
hue_rate = 0.15           ; colour cycling speed (radians per second)
saturation = 1.0
contrast = 0.85
sharpen = 0.15
layer_period = 1.5        ; seconds per cycle: textures -> eyes/fur -> whole objects
object_bias = 1.0         ; 0..1: 0 = follow the cycle above, 1 = always whole objects/animals (few eyes). effect shows from ~0.7
target_mean = 0.17        ; keeps the image from blowing out to flat colour
target_std = 0.20
seed = 67                 ; change for a completely different video
init_image =              ; optional: path to a photo to start the dream from (leave empty for noise)
fade_seconds = 1
; video encoder. Default is high-quality CPU H.264. Faster on NVIDIA:
;   encoder_args = -c:v h264_nvenc -preset p5 -cq 16 -pix_fmt yuv420p
encoder_args = -c:v libx264 -preset fast -crf 14 -pix_fmt yuv420p

[preview]
width = 500
height = 500
fps = 30
seconds = 20
segment_seconds = 10
output = preview.mp4
